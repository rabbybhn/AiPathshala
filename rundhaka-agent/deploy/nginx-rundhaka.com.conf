# /etc/nginx/sites-available/rundhaka.com
# Certbot adds the HTTPS (443) block and the HTTP->HTTPS redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name rundhaka.com www.rundhaka.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microphone access requires HTTPS; allow it for this site only.
    add_header Permissions-Policy "microphone=(self)" always;
}
